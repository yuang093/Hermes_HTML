<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>任務優先序決策器 🗂️</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1c1f26;
      --card-hover: #252936;
      --border: #2a2d3a;
      --text: #e8eaf0;
      --subtext: #8b8fa3;
      --col1: #ef4444;
      --col2: #f59e0b;
      --col3: #22c55e;
      --p1-header: rgba(239,68,68,0.15);
      --p2-header: rgba(245,158,11,0.15);
      --p3-header: rgba(34,197,94,0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(13,15,23,0.95);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-left h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .header-left .subtitle {
      font-size: 12px;
      color: var(--subtext);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #6366f1;
      color: #fff;
    }
    .btn-primary:hover { background: #5558e3; }

    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }
    .btn-secondary:hover { background: #3a3d4a; }

    .btn-reset {
      background: transparent;
      color: var(--subtext);
      border: 1px solid var(--border);
      padding: 6px 14px;
      font-size: 12px;
    }
    .btn-reset:hover { color: var(--text); border-color: #444; }

    main {
      flex: 1;
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .columns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      align-items: start;
    }

    .column {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .col-header {
      padding: 14px 18px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .col-header.p1 { background: var(--p1-header); color: var(--col1); }
    .col-header.p2 { background: var(--p2-header); color: var(--col2); }
    .col-header.p3 { background: var(--p3-header); color: var(--col3); }

    .col-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      font-weight: 600;
    }

    .col-body {
      padding: 12px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: grab;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      user-select: none;
    }

    .card:active { cursor: grabbing; }

    .card:hover {
      border-color: #444;
      background: var(--card-hover);
    }

    .card.dragging {
      opacity: 0.4;
      transform: scale(0.97);
    }

    .card.drag-over {
      border-color: #6366f1;
      background: rgba(99,102,241,0.1);
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .card-meta {
      font-size: 11px;
      color: var(--subtext);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card-tag {
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.07);
    }

    .card-tag.p1-tag { color: var(--col1); background: rgba(239,68,68,0.15); }
    .card-tag.p2-tag { color: var(--col2); background: rgba(245,158,11,0.15); }
    .card-tag.p3-tag { color: var(--col3); background: rgba(34,197,94,0.15); }

    .add-card-btn {
      width: 100%;
      padding: 10px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--subtext);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .add-card-btn:hover { border-color: #6366f1; color: #6366f1; }

    /* Modal for adding/editing cards */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
    }

    .modal h2 {
      font-size: 16px;
      margin-bottom: 16px;
    }

    .modal input, .modal textarea, .modal select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 10px;
    }

    .modal input:focus, .modal textarea:focus, .modal select:focus {
      outline: none;
      border-color: #6366f1;
    }

    .modal textarea { resize: vertical; min-height: 80px; }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 8px;
    }

    /* Output panel */
    #output-panel {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-top: 24px;
    }

    #output-panel.active { display: block; }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .output-header h2 {
      font-size: 15px;
      color: var(--text);
    }

    .output-content {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.7;
      color: #c4c9d8;
      white-space: pre-wrap;
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .copy-success {
      color: var(--col3);
      font-size: 12px;
      display: none;
      margin-left: 12px;
    }

    /* Instruction banner */
    .instruction {
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #a5b4fc;
    }

    @media (max-width: 768px) {
      .columns { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div>📋</div>
    <div>
      <h1>任務優先序決策器</h1>
      <div class="subtitle">拖曳調整優先順序，產出結構化 Prompt</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-reset" onclick="resetAll()">🔄 清空全部</button>
    <button class="btn btn-secondary" onclick="openAddModal()">+ 新增工作</button>
    <button class="btn btn-primary" onclick="generatePrompt()">📌 確定提交</button>
  </div>
</header>

<main>
  <div class="instruction">
    💡 操作說明：點「新增工作」新增卡片 → 拖曳卡片到不同優先級欄位 → 在同一欄內上下拖曳調整順序 → 完成後按「確定提交」產生 Prompt
  </div>

  <div class="columns">
    <div class="column">
      <div class="col-header p1">
        🔴 第一優先
        <span class="col-badge" id="count-p1">0</span>
      </div>
      <div class="col-body" id="col-p1" data-priority="1" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragleave="onDragLeave(event)">
      </div>
      <div style="padding:0 12px 12px">
        <button class="add-card-btn" onclick="openAddModal(1)">+ 新增到此欄</button>
      </div>
    </div>

    <div class="column">
      <div class="col-header p2">
        🟡 第二優先
        <span class="col-badge" id="count-p2">0</span>
      </div>
      <div class="col-body" id="col-p2" data-priority="2" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragleave="onDragLeave(event)">
      </div>
      <div style="padding:0 12px 12px">
        <button class="add-card-btn" onclick="openAddModal(2)">+ 新增到此欄</button>
      </div>
    </div>

    <div class="column">
      <div class="col-header p3">
        🟢 第三優先
        <span class="col-badge" id="count-p3">0</span>
      </div>
      <div class="col-body" id="col-p3" data-priority="3" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragleave="onDragLeave(event)">
      </div>
      <div style="padding:0 12px 12px">
        <button class="add-card-btn" onclick="openAddModal(3)">+ 新增到此欄</button>
      </div>
    </div>
  </div>

  <div id="output-panel">
    <div class="output-header">
      <h2>📋 產出 Prompt（可直接貼回給我）</h2>
      <div>
        <button class="btn btn-secondary" onclick="copyPrompt()" style="padding:6px 14px;font-size:12px">📋 複製</button>
        <span class="copy-success" id="copy-msg">✅ 已複製</span>
      </div>
    </div>
    <div class="output-content" id="prompt-output"></div>
  </div>
</main>

<!-- Add/Edit Card Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">新增工作</h2>
    <input type="hidden" id="edit-id" value="" />
    <input type="hidden" id="edit-priority" value="" />
    <input id="card-title" type="text" placeholder="工作標題（必填）" />
    <textarea id="card-desc" placeholder="詳細說明（可選）"></textarea>
    <select id="card-tag">
      <option value="">選擇標籤（可選）</option>
      <option value="技術">技術</option>
      <option value="管理">管理</option>
      <option value="文件">文件</option>
      <option value="測試">測試</option>
      <option value="部署">部署</option>
      <option value="研究">研究</option>
      <option value="設計">設計</option>
      <option value="其他">其他</option>
    </select>
    <div class="modal-actions">
      <button class="btn btn-reset" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveCard()">儲存</button>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let cards = [];
let draggedCardId = null;

// ── Storage ────────────────────────────────────────────────────────────────────
function saveState() {
  localStorage.setItem('prio_cards', JSON.stringify(cards));
}

function loadState() {
  const raw = localStorage.getItem('prio_cards');
  if (raw) {
    cards = JSON.parse(raw);
  } else {
    // Sample starter cards
    cards = [
      { id: 't1', title: '建立 Vercel HTML 專案（優先序決策器）', desc: '將所有 CaloScanAi 任務上传到 Vercel 優先序決策器', tag: '技術', priority: 1 },
      { id: 't2', title: '產出 6 種 UI/UX 原型提案', desc: '6種不同風格的登入/註冊/首頁設計，供選擇', tag: '設計', priority: 1 },
      { id: 't3', title: 'AI 生成使用者調查問卷', desc: '萃取核心功能需求', tag: '研究', priority: 1 },
      { id: 't4', title: '分析資料庫備份策略', desc: '.sql + .tar.gz 方案文件說明', tag: '研究', priority: 2 },
      { id: 't5', title: '實作影像壓縮模組', desc: '300KB、max 1200px、quality 0.85~0.4', tag: '技術', priority: 2 },
      { id: 't6', title: '串接 MiniMax AI 分析食物照片', desc: '熱量辨識核心功能', tag: '技術', priority: 2 },
      { id: 't7', title: '實作條碼掃描與字典檔搜尋', desc: 'BarcodeDictionary 查詢功能', tag: '技術', priority: 2 },
      { id: 't8', title: '寫 README.md', desc: '專案說明，含安裝與使用方式', tag: '文件', priority: 3 },
      { id: 't9', title: '實作後台儀表板', desc: '統計數據面板', tag: '技術', priority: 3 },
      { id: 't10', title: '實作帳號管理', desc: '改密碼、刪除、升級管理員', tag: '技術', priority: 3 },
      { id: 't11', title: '實作資料庫備份/還原機制', desc: '手動+自動備份、下載、還原', tag: '技術', priority: 3 },
      { id: 't12', title: '實作深色/亮色模式切換', desc: 'UI 深色/亮色主題切換', tag: '技術', priority: 3 },
      { id: 't13', title: '匯入 365 鼓勵語錄 + 首頁輪播', desc: '每日語錄輪播功能', tag: '技術', priority: 3 },
      { id: 't14', title: '實作斗內（Donation）按鈕', desc: '斗內功能按鈕', tag: '商業', priority: 3 },
    ];
  }
  renderAll();
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderAll() {
  const p1 = cards.filter(c => c.priority === 1);
  const p2 = cards.filter(c => c.priority === 2);
  const p3 = cards.filter(c => c.priority === 3);
  document.getElementById('count-p1').textContent = p1.length;
  document.getElementById('count-p2').textContent = p2.length;
  document.getElementById('count-p3').textContent = p3.length;
  document.getElementById('col-p1').innerHTML = renderCards(p1);
  document.getElementById('col-p2').innerHTML = renderCards(p2);
  document.getElementById('col-p3').innerHTML = renderCards(p3);
}

function renderCards(list) {
  return list.map(c => `
    <div class="card" draggable="true" data-id="${c.id}"
         ondragstart="onDragStart(event)" ondragend="onDragEnd(event)"
         ondblclick="editCard('${c.id}')">
      <div class="card-title">${escapeHtml(c.title)}</div>
      ${(c.desc||c.tag) ? `
      <div class="card-meta">
        ${c.tag ? `<span class="card-tag">${escapeHtml(c.tag)}</span>` : ''}
        ${c.desc ? `<span>${escapeHtml(c.desc.slice(0,40))}${c.desc.length>40?'...':''}</span>` : ''}
      </div>` : ''}
    </div>`).join('');
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ── Drag & Drop ────────────────────────────────────────────────────────────────
function onDragStart(e) {
  draggedCardId = e.currentTarget.dataset.id;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.card').forEach(c => c.classList.remove('drag-over'));
  draggedCardId = null;
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}

function onDragLeave(e) {
  // nothing special needed
}

function onDrop(e) {
  e.preventDefault();
  const targetCol = e.currentTarget;
  const newPriority = parseInt(targetCol.dataset.priority);
  const card = cards.find(c => c.id === draggedCardId);
  if (!card) return;
  card.priority = newPriority;
  saveState();
  renderAll();
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openAddModal(priority) {
  document.getElementById('modal-title').textContent = '新增工作';
  document.getElementById('edit-id').value = '';
  document.getElementById('edit-priority').value = priority || '';
  document.getElementById('card-title').value = '';
  document.getElementById('card-desc').value = '';
  document.getElementById('card-tag').value = '';
  document.getElementById('modal').classList.add('active');
  document.getElementById('card-title').focus();
}

function editCard(id) {
  const card = cards.find(c => c.id === id);
  if (!card) return;
  document.getElementById('modal-title').textContent = '編輯工作';
  document.getElementById('edit-id').value = id;
  document.getElementById('edit-priority').value = card.priority;
  document.getElementById('card-title').value = card.title;
  document.getElementById('card-desc').value = card.desc || '';
  document.getElementById('card-tag').value = card.tag || '';
  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function saveCard() {
  const title = document.getElementById('card-title').value.trim();
  if (!title) { alert('請輸入工作標題'); return; }

  const id = document.getElementById('edit-id').value;
  const priority = parseInt(document.getElementById('edit-priority').value) || 2;
  const desc = document.getElementById('card-desc').value.trim();
  const tag = document.getElementById('card-tag').value;

  if (id) {
    const card = cards.find(c => c.id === id);
    if (card) {
      card.title = title;
      card.desc = desc;
      card.tag = tag;
      card.priority = priority;
    }
  } else {
    cards.push({
      id: Date.now().toString(),
      title, desc, tag,
      priority
    });
  }
  saveState();
  renderAll();
  closeModal();
}

function resetAll() {
  if (!confirm('確定要清空所有工作？')) return;
  cards = [];
  saveState();
  renderAll();
  document.getElementById('output-panel').classList.remove('active');
}

// ── Generate Prompt ───────────────────────────────────────────────────────────
function generatePrompt() {
  if (cards.length === 0) {
    alert('還沒有任何工作，請先新增或新增範例資料');
    return;
  }

  const p1 = cards.filter(c => c.priority === 1).sort((a,b) => a.title.localeCompare(b.title, 'zh'));
  const p2 = cards.filter(c => c.priority === 2).sort((a,b) => a.title.localeCompare(b.title, 'zh'));
  const p3 = cards.filter(c => c.priority === 3).sort((a,b) => a.title.localeCompare(b.title, 'zh'));

  let lines = [];
  lines.push('以下是經過我優先序決策後的工作清單，請據此安排執行順序：\n');

  if (p1.length) {
    lines.push('🔴 第一優先（最高優先，盡快處理）：');
    p1.forEach((c, i) => {
      lines.push(`  ${i+1}. ${c.title}${c.tag ? ` [${c.tag}]` : ''}${c.desc ? `\n     → ${c.desc}` : ''}`);
    });
    lines.push('');
  }
  if (p2.length) {
    lines.push('🟡 第二優先（重要但非緊急）：');
    p2.forEach((c, i) => {
      lines.push(`  ${i+1}. ${c.title}${c.tag ? ` [${c.tag}]` : ''}${c.desc ? `\n     → ${c.desc}` : ''}`);
    });
    lines.push('');
  }
  if (p3.length) {
    lines.push('🟢 第三優先（可稍後處理）：');
    p3.forEach((c, i) => {
      lines.push(`  ${i+1}. ${c.title}${c.tag ? ` [${c.tag}]` : ''}${c.desc ? `\n     → ${c.desc}` : ''}`);
    });
    lines.push('');
  }

  lines.push('請根據以上優先順序執行，並在完成後向我報告進度。');
  const prompt = lines.join('\n');

  document.getElementById('prompt-output').textContent = prompt;
  document.getElementById('output-panel').classList.add('active');
  document.getElementById('copy-msg').style.display = 'none';
}

function copyPrompt() {
  const text = document.getElementById('prompt-output').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById('copy-msg');
    msg.style.display = 'inline';
    setTimeout(() => msg.style.display = 'none', 2000);
  });
}

// Close modal on outside click
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

// Init
loadState();
</script>
</body>
</html>
