<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CaloScanAi - 今日攝取</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      background: #FFF5F7;
      min-height: 100vh;
      color: #4A4A4A;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px 0;
    }

    .greeting {
      font-size: 13px;
      color: #9CA3AF;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .greeting-name {
      font-size: 20px;
      font-weight: 700;
      color: #4A4A4A;
      margin-top: 2px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #F9A8D4, #F472B6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: white;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(249, 168, 212, 0.4);
    }

    /* Calorie Ring Card */
    .calorie-card {
      background: white;
      border-radius: 28px;
      padding: 32px 24px;
      margin: 24px 20px;
      box-shadow: 0 8px 32px rgba(249, 168, 212, 0.15);
    }

    .calorie-ring-container {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin-bottom: 8px;
    }

    .calorie-ring {
      width: 200px;
      height: 200px;
      position: relative;
    }

    .calorie-ring svg {
      transform: rotate(-90deg);
      width: 200px;
      height: 200px;
    }

    .calorie-ring-bg {
      fill: none;
      stroke: #FDF2F8;
      stroke-width: 14;
    }

    .calorie-ring-progress {
      fill: none;
      stroke: url(#pinkGradient);
      stroke-width: 14;
      stroke-linecap: round;
      stroke-dasharray: 502;
      stroke-dashoffset: 151;
      filter: drop-shadow(0 4px 12px rgba(249, 168, 212, 0.4));
    }

    .calorie-ring-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .calorie-remaining {
      font-size: 36px;
      font-weight: 700;
      color: #4A4A4A;
      line-height: 1;
    }

    .calorie-unit {
      font-size: 14px;
      color: #9CA3AF;
      font-weight: 500;
      margin-top: 4px;
    }

    .calorie-target {
      text-align: center;
      font-size: 13px;
      color: #9CA3AF;
      margin-top: 16px;
    }

    .calorie-target span {
      color: #4A4A4A;
      font-weight: 600;
    }

    /* Macro Cards */
    .macro-section {
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .macro-card {
      background: white;
      border-radius: 20px;
      padding: 18px 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    .macro-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .macro-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .macro-dot.protein { background: #60A5FA; }
    .macro-dot.carbs { background: #FB923C; }
    .macro-dot.fat { background: #FACC15; }

    .macro-label {
      font-size: 13px;
      color: #9CA3AF;
      font-weight: 500;
    }

    .macro-value {
      font-size: 24px;
      font-weight: 700;
      color: #4A4A4A;
      margin-bottom: 4px;
    }

    .macro-unit {
      font-size: 12px;
      color: #9CA3AF;
      font-weight: 500;
    }

    .macro-progress {
      width: 100%;
      height: 6px;
      background: #F3F4F6;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 10px;
    }

    .macro-progress-bar {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    .macro-progress-bar.protein { background: linear-gradient(90deg, #60A5FA, #93C5FD); }
    .macro-progress-bar.carbs { background: linear-gradient(90deg, #FB923C, #FDBA74); }
    .macro-progress-bar.fat { background: linear-gradient(90deg, #FACC15, #FDE047); }

    /* Food Log Section */
    .food-log-section {
      padding: 0 20px;
      margin-bottom: 24px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #4A4A4A;
    }

    .section-link {
      font-size: 13px;
      color: #F9A8D4;
      font-weight: 600;
      text-decoration: none;
    }

    .food-log-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    .food-item {
      display: flex;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid #F9F9F9;
    }

    .food-item:last-child {
      border-bottom: none;
    }

    .food-time {
      font-size: 12px;
      color: #9CA3AF;
      font-weight: 500;
      width: 48px;
      flex-shrink: 0;
    }

    .food-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 14px;
      flex-shrink: 0;
    }

    .food-indicator.green { background: #BBF7D0; box-shadow: 0 2px 8px rgba(187, 247, 208, 0.6); }
    .food-indicator.orange { background: #FECACA; box-shadow: 0 2px 8px rgba(254, 202, 202, 0.6); }

    .food-info {
      flex: 1;
    }

    .food-name {
      font-size: 15px;
      font-weight: 600;
      color: #4A4A4A;
      margin-bottom: 2px;
    }

    .food-detail {
      font-size: 12px;
      color: #9CA3AF;
    }

    .food-calories {
      text-align: right;
      flex-shrink: 0;
    }

    .food-calories-value {
      font-size: 16px;
      font-weight: 700;
      color: #4A4A4A;
    }

    .food-calories-unit {
      font-size: 11px;
      color: #9CA3AF;
    }

    /* Camera Button */
    .camera-section {
      padding: 0 20px 100px;
    }

    .camera-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #F9A8D4, #F472B6);
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 17px;
      font-weight: 700;
      font-family: 'Noto Sans TC', sans-serif;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(244, 114, 182, 0.35);
      transition: all 0.3s ease;
    }

    .camera-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(244, 114, 182, 0.45);
    }

    .camera-btn:active {
      transform: translateY(0);
    }

    .camera-icon {
      width: 24px;
      height: 24px;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 12px 24px 28px;
      display: flex;
      justify-content: space-around;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.06);
      border-radius: 24px 24px 0 0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #9CA3AF;
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-item.active {
      color: #F472B6;
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
    }

    .nav-item span {
      font-size: 11px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div>
      <div class="greeting">早上好</div>
      <div class="greeting-name">小明 👋</div>
    </div>
    <div class="avatar">🍀</div>
  </div>

  <!-- Calorie Ring Card -->
  <div class="calorie-card">
    <div class="calorie-ring-container">
      <div class="calorie-ring">
        <svg viewBox="0 0 200 200">
          <defs>
            <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#F9A8D4"/>
              <stop offset="100%" stop-color="#F472B6"/>
            </linearGradient>
          </defs>
          <circle class="calorie-ring-bg" cx="100" cy="100" r="80"/>
          <circle class="calorie-ring-progress" cx="100" cy="100" r="80"/>
        </svg>
        <div class="calorie-ring-center">
          <div class="calorie-remaining">1380</div>
          <div class="calorie-unit">千卡剩餘</div>
        </div>
      </div>
    </div>
    <div class="calorie-target">
      今日目標 <span>2200</span> 千卡，已攝入 <span>820</span> 千卡
    </div>
  </div>

  <!-- Macro Cards -->
  <div class="macro-section">
    <div class="macro-card">
      <div class="macro-header">
        <div class="macro-dot protein"></div>
        <div class="macro-label">蛋白質</div>
      </div>
      <div class="macro-value">68</div>
      <div class="macro-unit">克</div>
      <div class="macro-progress">
        <div class="macro-progress-bar protein" style="width: 45%"></div>
      </div>
    </div>

    <div class="macro-card">
      <div class="macro-header">
        <div class="macro-dot carbs"></div>
        <div class="macro-label">碳水</div>
      </div>
      <div class="macro-value">142</div>
      <div class="macro-unit">克</div>
      <div class="macro-progress">
        <div class="macro-progress-bar carbs" style="width: 58%"></div>
      </div>
    </div>

    <div class="macro-card">
      <div class="macro-header">
        <div class="macro-dot fat"></div>
        <div class="macro-label">脂肪</div>
      </div>
      <div class="macro-value">38</div>
      <div class="macro-unit">克</div>
      <div class="macro-progress">
        <div class="macro-progress-bar fat" style="width: 52%"></div>
      </div>
    </div>
  </div>

  <!-- Food Log Section -->
  <div class="food-log-section">
    <div class="section-header">
      <div class="section-title">今日飲食</div>
      <a href="#" class="section-link">查看全部</a>
    </div>

    <div class="food-log-card">
      <div class="food-item">
        <div class="food-time">08:30</div>
        <div class="food-indicator green"></div>
        <div class="food-info">
          <div class="food-name">鮮奶燕麥粥 + 香蕉</div>
          <div class="food-detail">早餐 · 420 千卡</div>
        </div>
        <div class="food-calories">
          <div class="food-calories-value">420</div>
          <div class="food-calories-unit">千卡</div>
        </div>
      </div>

      <div class="food-item">
        <div class="food-time">12:15</div>
        <div class="food-indicator orange"></div>
        <div class="food-info">
          <div class="food-name">香煎雞胸肉沙拉</div>
          <div class="food-detail">午餐 · 380 千卡</div>
        </div>
        <div class="food-calories">
          <div class="food-calories-value">380</div>
          <div class="food-calories-unit">千卡</div>
        </div>
      </div>

      <div class="food-item">
        <div class="food-time">15:45</div>
        <div class="food-indicator green"></div>
        <div class="food-info">
          <div class="food-name">低糖優格 + 藍莓</div>
          <div class="food-detail">下午茶 · 120 千卡</div>
        </div>
        <div class="food-calories">
          <div class="food-calories-value">120</div>
          <div class="food-calories-unit">千卡</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Camera Button -->
  <div class="camera-section">
    <button class="camera-btn">
      <svg class="camera-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      拍照上傳食物
    </button>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>首頁</span>
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span>歷程</span>
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
      <span>記錄</span>
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>我的</span>
    </a>
  </nav>
</body>
</html>
