<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaloScanAi - 熱量追蹤</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1A1A3E 0%, #2D1B69 100%);
      padding: 16px;
      padding-bottom: 100px;
      color: #ffffff;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .greeting {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00F5FF 0%, #00D4AA 50%, #7B68EE 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: #1A1A3E;
      box-shadow: 0 0 20px rgba(0, 245, 255, 0.5), 0 0 40px rgba(0, 245, 255, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    /* Calorie Ring Section */
    .calorie-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .calorie-ring-container {
      position: relative;
      width: 220px;
      height: 220px;
      margin-bottom: 16px;
    }

    .calorie-ring {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .calorie-ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 12;
    }

    .calorie-ring-progress {
      fill: none;
      stroke: url(#neonGradient);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-dasharray: 565.48;
      stroke-dashoffset: 158.334;
      filter: drop-shadow(0 0 8px rgba(0, 245, 255, 0.8)) drop-shadow(0 0 16px rgba(0, 245, 255, 0.5));
      animation: pulseGlow 2s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(0, 245, 255, 0.8)) drop-shadow(0 0 16px rgba(0, 245, 255, 0.5)); }
      50% { filter: drop-shadow(0 0 12px rgba(0, 245, 255, 1)) drop-shadow(0 0 24px rgba(0, 245, 255, 0.7)); }
    }

    .calorie-ring-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .calorie-remaining {
      font-size: 42px;
      font-weight: 900;
      color: #00F5FF;
      line-height: 1;
      text-shadow: 0 0 20px rgba(0, 245, 255, 0.8), 0 0 40px rgba(0, 245, 255, 0.4);
    }

    .calorie-unit {
      font-size: 16px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 4px;
    }

    .calorie-target-text {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 12px;
      text-align: center;
    }

    /* Macro Cards */
    .macro-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .macro-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .macro-card:hover {
      transform: translateY(-4px);
    }

    .macro-card.protein {
      border-color: rgba(0, 191, 255, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 0 20px rgba(0, 191, 255, 0.1);
    }

    .macro-card.protein:hover {
      box-shadow: 0 8px 32px rgba(0, 191, 255, 0.3), inset 0 0 20px rgba(0, 191, 255, 0.15);
    }

    .macro-card.carbs {
      border-color: rgba(255, 165, 0, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 0 20px rgba(255, 165, 0, 0.1);
    }

    .macro-card.carbs:hover {
      box-shadow: 0 8px 32px rgba(255, 165, 0, 0.3), inset 0 0 20px rgba(255, 165, 0, 0.15);
    }

    .macro-card.fat {
      border-color: rgba(255, 255, 0, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 0 20px rgba(255, 255, 0, 0.1);
    }

    .macro-card.fat:hover {
      box-shadow: 0 8px 32px rgba(255, 255, 0, 0.3), inset 0 0 20px rgba(255, 255, 0, 0.15);
    }

    .macro-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .macro-card.protein .macro-icon { filter: drop-shadow(0 0 6px rgba(0, 191, 255, 0.8)); }
    .macro-card.carbs .macro-icon { filter: drop-shadow(0 0 6px rgba(255, 165, 0, 0.8)); }
    .macro-card.fat .macro-icon { filter: drop-shadow(0 0 6px rgba(255, 255, 0, 0.8)); }

    .macro-value {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .macro-card.protein .macro-value { color: #00BFFF; text-shadow: 0 0 10px rgba(0, 191, 255, 0.6); }
    .macro-card.carbs .macro-value { color: #FFA500; text-shadow: 0 0 10px rgba(255, 165, 0, 0.6); }
    .macro-card.fat .macro-value { color: #FFFF00; text-shadow: 0 0 10px rgba(255, 255, 0, 0.6); }

    .macro-label {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Food Log Section */
    .food-log-section {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }

    .food-log-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .food-log-title::before {
      content: '';
      width: 4px;
      height: 20px;
      background: linear-gradient(180deg, #00F5FF 0%, #7B68EE 100%);
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(0, 245, 255, 0.6);
    }

    .food-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .food-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .food-item:first-child {
      padding-top: 0;
    }

    .food-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .food-time {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      min-width: 50px;
    }

    .food-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .food-name {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }

    .food-macros {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.5);
    }

    .food-calories {
      font-size: 16px;
      font-weight: 700;
      color: #00F5FF;
      text-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
    }

    /* Camera Button */
    .camera-button {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(0, 245, 255, 0.5);
      box-shadow: 0 0 30px rgba(0, 245, 255, 0.4), 0 8px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .camera-button:hover {
      background: rgba(0, 245, 255, 0.2);
      border-color: rgba(0, 245, 255, 0.8);
      box-shadow: 0 0 40px rgba(0, 245, 255, 0.6), 0 8px 32px rgba(0, 0, 0, 0.4);
      transform: translateX(-50%) scale(1.05);
    }

    .camera-button:active {
      transform: translateX(-50%) scale(0.95);
    }

    .camera-icon {
      width: 28px;
      height: 28px;
      fill: #00F5FF;
      filter: drop-shadow(0 0 8px rgba(0, 245, 255, 0.8));
    }
  </style>
</head>
<body>

  <!-- SVG Defs -->
  <svg width="0" height="0" style="position: absolute;">
    <defs>
      <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#00F5FF;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#00D4AA;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:1" />
      </linearGradient>
    </defs>
  </svg>

  <!-- Header -->
  <header class="header">
    <div class="greeting">下午好，小美 👋</div>
    <div class="avatar">小</div>
  </header>

  <!-- Calorie Ring -->
  <section class="calorie-section">
    <div class="calorie-ring-container">
      <svg class="calorie-ring" viewBox="0 0 200 200">
        <circle class="calorie-ring-bg" cx="100" cy="100" r="90" />
        <circle class="calorie-ring-progress" cx="100" cy="100" r="90" />
      </svg>
      <div class="calorie-ring-text">
        <div class="calorie-remaining">1380</div>
        <div class="calorie-unit">千卡 剩餘</div>
      </div>
    </div>
    <div class="calorie-target-text">今日目標 2200 千卡</div>
  </section>

  <!-- Macro Cards -->
  <section class="macro-container">
    <div class="macro-card protein">
      <div class="macro-icon">💪</div>
      <div class="macro-value">68g</div>
      <div class="macro-label">蛋白質</div>
    </div>
    <div class="macro-card carbs">
      <div class="macro-icon">🍞</div>
      <div class="macro-value">142g</div>
      <div class="macro-label">碳水</div>
    </div>
    <div class="macro-card fat">
      <div class="macro-icon">🥑</div>
      <div class="macro-value">38g</div>
      <div class="macro-label">脂肪</div>
    </div>
  </section>

  <!-- Food Log -->
  <section class="food-log-section">
    <h2 class="food-log-title">今日飲食</h2>
    
    <div class="food-item">
      <div class="food-info">
        <div class="food-time">08:30</div>
        <div class="food-details">
          <div class="food-name">鮭魚三明治 + 鮮奶</div>
          <div class="food-macros">蛋白質 28g · 碳水 35g · 脂肪 12g</div>
        </div>
      </div>
      <div class="food-calories">420 kcal</div>
    </div>

    <div class="food-item">
      <div class="food-info">
        <div class="food-time">12:15</div>
        <div class="food-details">
          <div class="food-name">雞胸肉沙拉碗</div>
          <div class="food-macros">蛋白質 42g · 碳水 18g · 脂肪 8g</div>
        </div>
      </div>
      <div class="food-calories">320 kcal</div>
    </div>

    <div class="food-item">
      <div class="food-info">
        <div class="food-time">15:45</div>
        <div class="food-details">
          <div class="food-name">希臘優格 + 蜂蜜</div>
          <div class="food-macros">蛋白質 15g · 碳水 28g · 脂肪 6g</div>
        </div>
      </div>
      <div class="food-calories">215 kcal</div>
    </div>
  </section>

  <!-- Camera Button -->
  <button class="camera-button" aria-label="拍照上傳">
    <svg class="camera-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 15.2c-1.9 0-3.5-1.6-3.5-3.5S10.1 8.2 12 8.2s3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5z"/>
      <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
    </svg>
  </button>

</body>
</html>
